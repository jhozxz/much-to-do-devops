

services:
  backend:
    build: .
    container_name: muchtodo-backend
    ports:
      - "8080:8080"
    environment:
      - MONGO_URI=mongodb://admin:password@mongodb:27017/muchtodo?authSource=admin
      - PORT=8080
    depends_on:
      - mongodb
    networks:
      - app-network
    restart: on-failure

  mongodb:
    image: mongo:6.0
    container_name: muchtodo-db
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mongo-data:
